stages:
  - build
  - package

build-website:
  stage: build

  image: registry.git.tobydavis.dev/tobydavis/homelab/lix-devenv:ubuntu

  script:
    - devenv shell --command "dx bundle --release --platform web"

  artifacts:
    paths:
      - target/dx/tobydavis-dev/release/web/

package-website:
  stage: package

  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]

  before_script:
    - mkdir -p /kaniko/.docker
    - >-
      echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$(printf '%s:%s'
      "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}"
      | base64 | tr -d '\n')\"}}}"
      > /kaniko/.docker/config.json

  script:
    - >-
      /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
      --destination "${CI_REGISTRY_IMAGE}:latest"
