[package]
name = "tobydavis-dev"
version = "0.1.0"
authors = ["Toby Davis"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
dioxus = { version = "0.7.4", features = ["router", "fullstack"] }
serde = { version = "1", features = ["derive"] }
toml = "1.1.2"
typst = "0.14"
typst-assets = { version = "0.14", features = ["fonts"] }
typst-html = "0.14"
typst-kit = "0.14"

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
server = ["dioxus/server"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = "fat"
opt-level = 3
strip = true
debug = false
debug-assertions = false
